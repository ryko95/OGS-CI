name: Veille médiatique OGS-CI

on:
  push:
    paths:
      - '.github/workflows/veille.yml'
      - 'scripts/veille.py'
      - 'data/veille_config.json'
  schedule:
    - cron: '17 1,7,13,19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veille-medias
  cancel-in-progress: false

jobs:
  surveiller:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Rechercher les liens publics
        run: python scripts/veille.py
      - name: Envoyer les nouveaux liens par e-mail
        env:
          OGS_SMTP_USER: ${{ secrets.OGS_SMTP_USER }}
          OGS_SMTP_PASSWORD: ${{ secrets.OGS_SMTP_PASSWORD }}
          OGS_ALERT_EMAIL: ${{ secrets.OGS_ALERT_EMAIL }}
        run: python scripts/alerte_email.py
      - name: Publier le relevé de veille
        run: |
          git add data/veille.json data/alerte_email.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name='OGS-CI veille' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Actualiser la veille médiatique'
          git push
